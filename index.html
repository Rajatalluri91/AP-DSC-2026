<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP DSC 2026 Pro Study Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <div>
        <!-- Header Section -->
        <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 p-4">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <div id="backButtonContainer" class="hidden">
                    <button onclick="goBack()" class="bg-slate-800 hover:bg-slate-700 text-orange-400 px-3 py-1.5 rounded-xl text-sm flex items-center gap-1.5 transition border border-slate-700 shadow">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                </div>
                <h1 class="text-lg md:text-xl font-bold flex items-center gap-2 mx-auto tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-200">
                    <i class="fa-solid fa-graduation-cap text-orange-400"></i> AP DSC 2026 PRO
                </h1>
                <div style="width: 60px;"></div>
            </div>
        </header>

        <!-- Main Content Container -->
        <main class="max-w-4xl mx-auto p-4 md:p-6">
            
            <!-- Add-on 1: Quick Search Bar (Appears on Subjects View) -->
            <div id="searchContainer" class="mb-5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterSubjects()" placeholder="Search subjects or topics..." 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-2xl py-3 pl-11 pr-4 text-sm text-slate-200 placeholder-slate-400 focus:outline-none focus:border-orange-500 transition shadow-inner">
                </div>
            </div>

            <!-- Add-on 2: Motivation / Stats Banner -->
            <div id="statsBanner" class="glass-card rounded-2xl p-4 mb-5 flex items-center justify-between border-l-4 border-l-orange-500 shadow-lg">
                <div>
                    <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-wider">Target 2026</h3>
                    <p class="text-sm font-bold text-slate-200 mt-0.5">Consistency is the key to cracking DSC!</p>
                </div>
                <div class="bg-orange-500/20 text-orange-400 p-2.5 rounded-xl border border-orange-500/30">
                    <i class="fa-solid fa-fire text-lg"></i>
                </div>
            </div>

            <!-- Dynamic App View -->
            <div id="appContainer"></div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-500 text-xs border-t border-slate-800/60 mt-10">
        &copy; 2026 AP DSC Master Portal. Built for Excellence.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const dscData = [
            {
                subjectName: "Psychology & Pedagogy",
                icon: "https://img.icons8.com/color/96/expert.png",
                classes: [
                    {
                        className: "Class 6 to 8 (Core Concepts)",
                        lessons: [
                            { title: "Child Development & Growth", githubLink: "https://your-username.github.io/ap-dsc/pedagogy/child-dev.html" },
                            { title: "Learning Theories & Applications", githubLink: "https://your-username.github.io/ap-dsc/pedagogy/learning-theories.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Telugu (తెలుగు)",
                icon: "https://img.icons8.com/color/96/literature.png",
                classes: [
                    {
                        className: "Class 3",
                        lessons: [
                            { title: "Lesson 1: Chettu - Upayogalu", githubLink: "https://your-username.github.io/ap-dsc/telugu/class3-les1.html" },
                            { title: "Lesson 2: Desha Bhakti", githubLink: "https://your-username.github.io/ap-dsc/telugu/class3-les2.html" }
                        ]
                    },
                    {
                        className: "Class 10",
                        lessons: [
                            { title: "Lesson 1: Dampatyamu", githubLink: "https://your-username.github.io/ap-dsc/telugu/class10-les1.html" },
                            { title: "Lesson 2: Nagajuna Sagar", githubLink: "https://your-username.github.io/ap-dsc/telugu/class10-les2.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "English",
                icon: "https://img.icons8.com/color/96/books.png",
                classes: [
                    {
                        className: "Class 6",
                        lessons: [
                            { title: "Unit 1: Peace and Harmony", githubLink: "https://your-username.github.io/ap-dsc/english/class6-unit1.html" },
                            { title: "Unit 2: The Wonderful World", githubLink: "https://your-username.github.io/ap-dsc/english/class6-unit2.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Mathematics (గణితం)",
                icon: "https://img.icons8.com/color/96/math.png",
                classes: [
                    {
                        className: "Class 8",
                        lessons: [
                            { title: "Rational Numbers", githubLink: "https://your-username.github.io/ap-dsc/maths/class8-rational.html" },
                            { title: "Linear Equations", githubLink: "https://your-username.github.io/ap-dsc/maths/class8-linear.html" }
                        ]
                    },
                    {
                        className: "Class 10",
                        lessons: [
                            { title: "Real Numbers & Polynomials", githubLink: "https://your-username.github.io/ap-dsc/maths/class10-realnumbers.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "General Science",
                icon: "https://img.icons8.com/color/96/physics.png",
                classes: [
                    {
                        className: "Class 7",
                        lessons: [
                            { title: "Food Components & Nutrition", githubLink: "https://your-username.github.io/ap-dsc/science/class7-food.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Social Studies",
                icon: "https://img.icons8.com/color/96/globe.png",
                classes: [
                    {
                        className: "Class 9",
                        lessons: [
                            { title: "The Indian Constitution", githubLink: "https://your-username.github.io/ap-dsc/social/class9-constitution.html" }
                        ]
                    }
                ]
            }
        ];

        let currentView = 'subjects';
        let selectedSubjectIndex = null;
        let selectedClassIndex = null;

        function renderApp(filteredData = dscData) {
            const container = document.getElementById('appContainer');
            const backBtnContainer = document.getElementById('backButtonContainer');
            const searchContainer = document.getElementById('searchContainer');
            const statsBanner = document.getElementById('statsBanner');
            
            container.innerHTML = "";

            if (currentView === 'subjects') {
                backBtnContainer.classList.add('hidden');
                searchContainer.classList.remove('hidden');
                statsBanner.classList.remove('hidden');

                let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5" id="subjectsGrid">';
                
                filteredData.forEach((sub) => {
                    // Find original index in dscData to ensure proper click handling
                    let originalIndex = dscData.findIndex(s => s.subjectName === sub.subjectName);
                    html += `
                        <button onclick="openSubject(${originalIndex})" class="glass-card p-4 rounded-2xl hover:border-orange-500/50 hover:bg-slate-800 transition flex items-center justify-between text-left group shadow-lg">
                            <div class="flex items-center gap-3.5">
                                <img src="${sub.icon}" class="w-11 h-11 object-contain drop-shadow">
                                <span class="font-bold text-slate-100 text-base group-hover:text-orange-400 transition">${sub.subjectName}</span>
                            </div>
                            <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-orange-500 group-hover:text-white transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } else if (currentView === 'classes') {
                backBtnContainer.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                statsBanner.classList.add('hidden');

                let sub = dscData[selectedSubjectIndex];
                let html = `
                    <div class="glass-card p-4 rounded-2xl mb-4 flex items-center gap-3 border-l-4 border-l-blue-500">
                        <img src="${sub.icon}" class="w-8 h-8">
                        <h2 class="text-base font-bold text-slate-100">${sub.subjectName} - Select Class</h2>
                    </div>
                    <div class="space-y-3">
                `;
                
                sub.classes.forEach((cls, index) => {
                    html += `
                        <button onclick="openClass(${index})" class="w-full glass-card p-4 rounded-2xl hover:border-blue-500/50 hover:bg-slate-800 transition flex items-center justify-between text-left group shadow-lg">
                            <span class="font-semibold text-blue-400 flex items-center gap-2.5">
                                <i class="fa-solid fa-layer-group text-slate-400 group-hover:text-blue-400"></i>${cls.className}
                            </span>
                            <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } else if (currentView === 'lessons') {
                backBtnContainer.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                statsBanner.classList.add('hidden');

                let sub = dscData[selectedSubjectIndex];
                let cls = sub.classes[selectedClassIndex];
                let html = `
                    <div class="glass-card p-4 rounded-2xl mb-4 border-l-4 border-l-emerald-500">
                        <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-emerald-400"></i>${cls.className} Lessons
                        </h2>
                    </div>
                    <div class="space-y-2.5">
                `;
                
                cls.lessons.forEach(les => {
                    html += `
                        <a href="${les.githubLink}" target="_blank" class="block glass-card p-4 rounded-2xl hover:bg-slate-800 hover:border-emerald-500/50 transition flex items-center justify-between group shadow-lg">
                            <span class="text-sm font-medium text-slate-200 group-hover:text-emerald-300 transition flex items-center gap-2.5">
                                <i class="fa-solid fa-file-lines text-slate-500 group-hover:text-emerald-400"></i>${les.title}
                            </span>
                            <span class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 group-hover:bg-emerald-600 group-hover:text-white transition">
                                Read Notes <i class="fa-solid fa-external-link-alt text-[10px]"></i>
                            </span>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        }

        // Add-on 3: Instant Subject Search Logic
        function filterSubjects() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dscData.filter(sub => sub.subjectName.toLowerCase().includes(query));
            renderApp(filtered);
        }

        function openSubject(index) {
            selectedSubjectIndex = index;
            currentView = 'classes';
            history.pushState({ view: 'classes', sub: index }, '');
            renderApp();
            window.scrollTo(0, 0);
        }

        function openClass(index) {
            selectedClassIndex = index;
            currentView = 'lessons';
            history.pushState({ view: 'lessons', sub: selectedSubjectIndex, cls: index }, '');
            renderApp();
            window.scrollTo(0, 0);
        }

        function goBack() {
            window.history.back();
        }

        window.onpopstate = function(event) {
            if (event.state) {
                currentView = event.state.view;
                selectedSubjectIndex = event.state.sub !== undefined ? event.state.sub : null;
                selectedClassIndex = event.state.cls !== undefined ? event.state.cls : null;
            } else {
                currentView = 'subjects';
                selectedSubjectIndex = null;
                selectedClassIndex = null;
            }
            renderApp();
        };

        window.onload = function() {
            history.replaceState({ view: 'subjects' }, '');
            renderApp();
        };
    </script>
</body>
</html>
