<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP DSC 2026 Complete Study Portal</title>
    <!-- Tailwind CSS for Professional UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans antialiased">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white shadow-md p-6 text-center">
        <h1 class="text-2xl md:text-3xl font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-graduation-cap text-orange-400"></i> AP DSC 2026 Master Portal
        </h1>
        <p class="text-sm text-orange-200 mt-1">Subjects, Classes (3-10) & GitHub Notes Linker</p>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <div id="appContainer" class="space-y-4">
            <!-- Dynamic Content Will Load Here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-500 text-sm">
        &copy; 2026 AP DSC Preparation. Designed for Aspiring Teachers.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Complete DSC Data Structure (Subjects -> Classes -> Lessons with GitHub Links)
        const dscData = [
            {
                subjectName: "Psychology & Pedagogy",
                icon: "https://img.icons8.com/color/96/expert.png",
                classes: [
                    {
                        className: "Class 6 to 8 (Core Concepts)",
                        lessons: [
                            { title: "Child Development & Growth", githubLink: "https://your-username.github.io/ap-dsc/pedagogy/child-dev.html" },
                            { title: "Learning Theories & Applications", githubLink: "https://your-username.github.io/ap-dsc/pedagogy/learning-theories.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Telugu (తెలుగు)",
                icon: "https://img.icons8.com/color/96/literature.png",
                classes: [
                    {
                        className: "Class 3",
                        lessons: [
                            { title: "Lesson 1: Chettu - Upayogalu", githubLink: "https://your-username.github.io/ap-dsc/telugu/class3-les1.html" },
                            { title: "Lesson 2: Desha Bhakti", githubLink: "https://your-username.github.io/ap-dsc/telugu/class3-les2.html" }
                        ]
                    },
                    {
                        className: "Class 10",
                        lessons: [
                            { title: "Lesson 1: Dampatyamu", githubLink: "https://your-username.github.io/ap-dsc/telugu/class10-les1.html" },
                            { title: "Lesson 2: Nagajuna Sagar", githubLink: "https://your-username.github.io/ap-dsc/telugu/class10-les2.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "English",
                icon: "https://img.icons8.com/color/96/books.png",
                classes: [
                    {
                        className: "Class 6",
                        lessons: [
                            { title: "Unit 1: Peace and Harmony", githubLink: "https://your-username.github.io/ap-dsc/english/class6-unit1.html" },
                            { title: "Unit 2: The Wonderful World", githubLink: "https://your-username.github.io/ap-dsc/english/class6-unit2.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Mathematics (గణితం)",
                icon: "https://img.icons8.com/color/96/math.png",
                classes: [
                    {
                        className: "Class 8",
                        lessons: [
                            { title: "Rational Numbers", githubLink: "https://your-username.github.io/ap-dsc/maths/class8-rational.html" },
                            { title: "Linear Equations", githubLink: "https://your-username.github.io/ap-dsc/maths/class8-linear.html" }
                        ]
                    },
                    {
                        className: "Class 10",
                        lessons: [
                            { title: "Real Numbers & Polynomials", githubLink: "https://your-username.github.io/ap-dsc/maths/class10-realnumbers.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "General Science",
                icon: "https://img.icons8.com/color/96/physics.png",
                classes: [
                    {
                        className: "Class 7",
                        lessons: [
                            { title: "Food Components & Nutrition", githubLink: "https://your-username.github.io/ap-dsc/science/class7-food.html" }
                        ]
                    }
                ]
            },
            {
                subjectName: "Social Studies",
                icon: "https://img.icons8.com/color/96/globe.png",
                classes: [
                    {
                        className: "Class 9",
                        lessons: [
                            { title: "The Indian Constitution", githubLink: "https://your-username.github.io/ap-dsc/social/class9-constitution.html" }
                        ]
                    }
                ]
            }
        ];

        // Render UI Function
        function renderPortal() {
            const container = document.getElementById('appContainer');
            container.innerHTML = "";

            dscData.forEach((sub, subIndex) => {
                let subjectCard = document.createElement('div');
                subjectCard.className = "bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden transition";

                // Subject Header
                let subHeader = `
                    <button onclick="toggleSection('sub-${subIndex}')" class="w-full flex items-center justify-between p-4 bg-white hover:bg-gray-50 transition text-left">
                        <div class="flex items-center gap-3">
                            <img src="${sub.icon}" class="w-10 h-10 object-contain">
                            <span class="font-bold text-lg text-gray-800">${sub.subjectName}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down text-gray-400 transition" id="icon-sub-${subIndex}"></i>
                    </button>
                `;

                // Classes Container (Hidden by default)
                let classesDiv = document.createElement('div');
                classesDiv.id = `sub-${subIndex}`;
                classesDiv.className = "hidden bg-gray-50 border-t border-gray-100 p-4 space-y-3";

                sub.classes.forEach((cls, clsIndex) => {
                    let classBox = document.createElement('div');
                    classBox.className = "bg-white rounded-xl shadow-xs border border-gray-200 p-3";

                    let classHeader = `
                        <button onclick="toggleSection('cls-${subIndex}-${clsIndex}')" class="w-full flex justify-between items-center text-left font-semibold text-blue-700 text-sm">
                            <span><i class="fa-solid fa-layer-group mr-2"></i>${cls.className}</span>
                            <i class="fa-solid fa-plus text-xs" id="icon-cls-${subIndex}-${clsIndex}"></i>
                        </button>
                    `;

                    // Lessons List (Hidden by default)
                    let lessonsList = document.createElement('ul');
                    lessonsList.id = `cls-${subIndex}-${clsIndex}`;
                    lessonsList.className = "hidden mt-3 pl-4 space-y-2 border-l-2 border-blue-400";

                    cls.lessons.forEach(les => {
                        let li = document.createElement('li');
                        li.innerHTML = `
                            <a href="${les.githubLink}" target="_blank" class="flex items-center justify-between text-xs md:text-sm text-gray-700 hover:text-blue-600 bg-gray-50 hover:bg-blue-50 p-2 rounded-lg transition">
                                <span><i class="fa-solid fa-file-lines mr-2 text-gray-400"></i>${les.title}</span>
                                <span class="bg-blue-600 text-white px-2 py-1 rounded text-[10px] font-semibold flex items-center gap-1">
                                    Open <i class="fa-solid fa-external-link-alt"></i>
                                </span>
                            </a>
                        `;
                        lessonsList.appendChild(li);
                    });

                    classBox.innerHTML = classHeader;
                    classBox.appendChild(lessonsList);
                    classesDiv.appendChild(classBox);
                });

                subjectCard.innerHTML = subHeader;
                subjectCard.appendChild(classesDiv);
                container.appendChild(subjectCard);
            });
        }

        // Toggle Expand/Collapse helper
        function toggleSection(id) {
            const element = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (element.classList.contains('hidden')) {
                element.classList.remove('hidden');
                if(icon) {
                    icon.classList.remove('fa-chevron-down', 'fa-plus');
                    icon.classList.add('fa-chevron-up', 'fa-minus');
                }
            } else {
                element.classList.add('hidden');
                if(icon) {
                    icon.classList.remove('fa-chevron-up', 'fa-minus');
                    icon.classList.add('fa-chevron-down', 'fa-plus');
                }
            }
        }

        window.onload = renderPortal;
    </script>
</body>
</html>
