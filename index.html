                                sectionName: "History (చరిత్ర)",
                                lessons: [
                                    { title: "ఫ్రెంచ్ విప్లవం", githubLink: "#" },
                                    { title: "యూరోప్‌లో సామ్రాజ్యవాదం మరియు నాజిజం", githubLink: "#" }
                                ]
                            },
                            {
                                sectionName: "Civics (పౌరశాస్త్రం)",
                                lessons: [
                                    { title: "సార్వభౌమ మరియు ప్రజాస్వామ్య వ్యవస్థ", githubLink: "#" },
                                    { title: "ప్రాథమిక హక్కులు - విధులు", githubLink: "#" }
                                ]
                            },
                            {
                                sectionName: "Economics (అర్థశాస్త్రం)",
                                lessons: [
                                    { title: "ఉత్పత్తి వ్యవస్థ - అర్థశాస్త్రం", githubLink: "#" },
                                    { title: "పేదరికం - ఒక సవాలు", githubLink: "#" }
                                ]
                            }
                        ]
                    },
                    {
                        className: "Class 10",
                        sections: [
                            {
                                sectionName: "Geography (భూగోళశాస్త్రం)",
                                lessons: [
                                    { title: "భారతదేశ నైసర్గిక స్వరూపాలు", githubLink: "#" },
                                    { title: "భారతదేశంలో ఖనిజాలు మరియు శక్తి వనరులు", githubLink: "#" }
                                ]
                            },
                            {
                                sectionName: "History (చరిత్ర)",
                                lessons: [
                                    { title: "ప్రపంచ యుద్ధాలు మరియు స్వాతంత్ర్య ఉద్యమాలు", githubLink: "#" },
                                    { title: "భారతదేశంలో జాతీయ ఉద్యమం", githubLink: "#" }
                                ]
                            },
                            {
                                sectionName: "Civics (పౌరశాస్త్రం)",
                                lessons: [
                                    { title: "భారత పార్లమెంటరీ వ్యవస్థ - చట్టాలు", githubLink: "#" },
                                    { title: "భారత విదేశాంగ విధానం", githubLink: "#" }
                                ]
                            },
                            {
                                sectionName: "Economics (అర్థశాస్త్రం)",
                                lessons: [
                                    { title: "ప్రపంచీకరణ మరియు అభివృద్ధి", githubLink: "#" },
                                    { title: "భారతదేశంలో వినియోగదారుల హక్కులు", githubLink: "#" }
                                ]
                            }
                        ]
                    }
                ]
            }
        ];

        let currentView = 'subjects'; 
        let selectedSubjectIndex = null;
        let selectedClassIndex = null;
        let selectedSectionIndex = null;

        function renderApp(filteredData = dscData) {
            const container = document.getElementById('appContainer');
            const backBtnContainer = document.getElementById('backButtonContainer');
            const searchContainer = document.getElementById('searchContainer');
            const statsBanner = document.getElementById('statsBanner');
            
            container.innerHTML = "";

            if (currentView === 'subjects') {
                backBtnContainer.classList.add('hidden');
                searchContainer.classList.remove('hidden');
                statsBanner.classList.remove('hidden');

                let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5" id="subjectsGrid">';
                
                filteredData.forEach((sub) => {
                    let originalIndex = dscData.findIndex(s => s.subjectName === sub.subjectName);
                    html += `
                        <button onclick="openSubject(${originalIndex})" class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl hover:border-orange-500/50 hover:bg-slate-800/80 transition flex items-center justify-between text-left group shadow-lg">
                            <div class="flex items-center gap-3.5">
                                <img src="${sub.icon}" class="w-11 h-11 object-contain drop-shadow">
                                <span class="font-bold text-slate-100 text-base group-hover:text-orange-400 transition">${sub.subjectName}</span>
                            </div>
                            <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-orange-500 group-hover:text-white transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } else if (currentView === 'classes') {
                backBtnContainer.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                statsBanner.classList.add('hidden');

                let sub = dscData[selectedSubjectIndex];
                let html = `
                    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl mb-4 flex items-center gap-3 border-l-4 border-l-blue-500 shadow-lg">
                        <img src="${sub.icon}" class="w-8 h-8">
                        <h2 class="text-base font-bold text-slate-100">${sub.subjectName} - Select Class</h2>
                    </div>
                    <div class="space-y-3">
                `;
                
                sub.classes.forEach((cls, index) => {
                    html += `
                        <button onclick="openClass(${index})" class="w-full bg-slate-900/60 border border-slate-800 p-4 rounded-2xl hover:border-blue-500/50 hover:bg-slate-800/80 transition flex items-center justify-between text-left group shadow-lg">
                            <span class="font-semibold text-blue-400 flex items-center gap-2.5">
                                <i class="fa-solid fa-layer-group text-slate-400 group-hover:text-blue-400"></i>${cls.className}
                            </span>
                            <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } else if (currentView === 'sections') {
                backBtnContainer.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                statsBanner.classList.add('hidden');

                let sub = dscData[selectedSubjectIndex];
                let cls = sub.classes[selectedClassIndex];
                let html = `
                    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl mb-4 border-l-4 border-l-purple-500 shadow-lg">
                        <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-purple-400"></i>${cls.className} - Select Section
                        </h2>
                    </div>
                    <div class="space-y-3">
                `;
                
                cls.sections.forEach((sec, index) => {
                    html += `
                        <button onclick="openSection(${index})" class="w-full bg-slate-900/60 border border-slate-800 p-4 rounded-2xl hover:border-purple-500/50 hover:bg-slate-800/80 transition flex items-center justify-between text-left group shadow-lg">
                            <span class="font-semibold text-purple-300 flex items-center gap-2.5">
                                <i class="fa-solid fa-book-bookmark text-slate-400 group-hover:text-purple-400"></i>${sec.sectionName}
                            </span>
                            <div class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-purple-600 group-hover:text-white transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </div>
                        </button>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } else if (currentView === 'lessons') {
                backBtnContainer.classList.remove('hidden');
                searchContainer.classList.add('hidden');
                statsBanner.classList.add('hidden');

                let sub = dscData[selectedSubjectIndex];
                let cls = sub.classes[selectedClassIndex];
                let sec = cls.sections[selectedSectionIndex];
                let html = `
                    <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl mb-4 border-l-4 border-l-emerald-500 shadow-lg">
                        <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-emerald-400"></i>${sec.sectionName} Lessons
                        </h2>
                    </div>
                    <div class="space-y-2.5">
                `;
                
                sec.lessons.forEach(les => {
                    html += `
                        <a href="${les.githubLink}" target="_blank" class="block bg-slate-900/60 border border-slate-800 p-4 rounded-2xl hover:bg-slate-800/80 hover:border-emerald-500/50 transition flex items-center justify-between group shadow-lg">
                            <span class="text-sm font-medium text-slate-200 group-hover:text-emerald-300 transition flex items-center gap-2.5">
                                <i class="fa-solid fa-file-lines text-slate-500 group-hover:text-emerald-400"></i>${les.title}
                            </span>
                            <span class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 group-hover:bg-emerald-600 group-hover:text-white transition">
                                Read Notes <i class="fa-solid fa-external-link-alt text-[10px]"></i>
                            </span>
                        </a>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }
        }

        function filterSubjects() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = dscData.filter(sub => sub.subjectName.toLowerCase().includes(query));
            renderApp(filtered);
        }

        function openSubject(index) {
            selectedSubjectIndex = index;
            currentView = 'classes';
            history.pushState({ view: 'classes', sub: index }, '');
            renderApp();
            window.scrollTo(0, 0);
        }

        function openClass(index) {
            selectedClassIndex = index;
            currentView = 'sections';
            history.pushState({ view: 'sections', sub: selectedSubjectIndex, cls: index }, '');
            renderApp();
            window.scrollTo(0, 0);
        }

        function openSection(index) {
            selectedSectionIndex = index;
            currentView = 'lessons';
            history.pushState({ view: 'lessons', sub: selectedSubjectIndex, cls: selectedClassIndex, sec: index }, '');
            renderApp();
            window.scrollTo(0, 0);
        }

        function goBack() {
            window.history.back();
        }

        window.onpopstate = function(event) {
            if (event.state) {
                currentView = event.state.view;
                selectedSubjectIndex = event.state.sub !== undefined ? event.state.sub : null;
                selectedClassIndex = event.state.cls !== undefined ? event.state.cls : null;
                selectedSectionIndex = event.state.sec !== undefined ? event.state.sec : null;
            } else {
                currentView = 'subjects';
                selectedSubjectIndex = null;
                selectedClassIndex = null;
                selectedSectionIndex = null;
            }
            renderApp();
        };

        window.onload = function() {
            history.replaceState({ view: 'subjects' }, '');
            renderApp();
        };
    </script>

    <!-- Register Service Worker for Target DSC PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Target DSC Service Worker Registered Successfully', reg))
                    .catch((err) => console.log('Service Worker Registration Failed', err));
            });
        }
    </script>
</body>
</html>
