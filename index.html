<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP DSC 2026 Master Preparation</title>
    <!-- Tailwind CSS for Modern & Attractive Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white shadow-lg p-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap text-orange-400"></i> AP DSC 2026
                </h1>
                <p class="text-sm text-orange-200 mt-1">Professional Study Portal & Lessons</p>
            </div>
            <div class="bg-orange-500 text-xs px-3 py-1 rounded-full font-semibold shadow">
                Live Portal
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-book-open text-blue-600"></i> Select Subject & Lessons
        </h2>

        <!-- Subjects Grid -->
        <div id="subjectsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamically Loaded via JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-gray-500 text-sm">
        &copy; 2026 AP DSC Preparation App. All Rights Reserved.
    </footer>

    <!-- Application Script -->
    <script>
        async function loadDSCData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const container = document.getElementById('subjectsContainer');
                
                container.innerHTML = "";

                data.subjects.forEach(sub => {
                    let lessonsHtml = sub.lessons.map(les => `
                        <li class="flex justify-between items-center py-2 border-b border-gray-100 last:border-none">
                            <span class="text-gray-700 text-sm font-medium">${les.lessonTitle}</span>
                            <a href="${les.githubPageLink}" target="_blank" 
                               class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg shadow transition flex items-center gap-1">
                                <i class="fa-solid fa-eye"></i> Read Notes
                            </a>
                        </li>
                    `).join('');

                    let card = `
                        <div class="bg-white rounded-2xl shadow-md p-5 border border-gray-100 hover:shadow-lg transition">
                            <div class="flex items-center gap-3 mb-3">
                                <img src="${sub.iconImage}" alt="icon" class="w-12 h-12 object-contain">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${sub.subjectName}</h3>
                                    <span class="text-xs text-orange-600 font-semibold">${sub.category}</span>
                                </div>
                            </div>
                            <ul class="divide-y divide-gray-100 mt-2">
                                ${lessonsHtml}
                            </ul>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        window.onload = loadDSCData;

        // Service Worker Registration for Offline support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered Successfully"));
        }
    </script>
</body>
</html>
